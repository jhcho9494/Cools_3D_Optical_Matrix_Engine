<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Rewritable three-dimensional optical weight cycle</title>
  <desc id="desc">A selected optical weight voxel is locally rewritten by a sub-bandgap processing beam and verified through a calibration loop.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f9ff"/><stop offset="1" stop-color="#e7f0fb"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffef85" stop-opacity="0.15"/><stop offset="1" stop-color="#ff9d2f" stop-opacity="0.85"/></linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 z" fill="#31547a"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#001b33" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d">Rewritable Nonvolatile 3D Weight Volume</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#506a80">Local optical writing changes selected refractive-index states without rebuilding the device</text>

  <g filter="url(#shadow)">
    <rect x="70" y="120" width="380" height="360" rx="22" fill="url(#panel)" stroke="#7ea6c9" stroke-width="2"/>
    <text x="260" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1d486f">1 · SELECT A WEIGHT VOXEL</text>
    <rect x="130" y="185" width="260" height="235" rx="15" fill="#dcecff" stroke="#6e9bc4" stroke-width="2"/>
    <g fill="#7552c7" stroke="#493294" stroke-width="1.3">
      <circle cx="175" cy="235" r="12"/><circle cx="230" cy="270" r="11"/><circle cx="300" cy="225" r="13"/>
      <circle cx="350" cy="285" r="10"/><circle cx="190" cy="340" r="13"/><circle cx="265" cy="370" r="11"/>
      <circle cx="340" cy="355" r="12"/>
    </g>
    <circle cx="275" cy="305" r="20" fill="#ffb03a" stroke="#c77200" stroke-width="3"/>
    <circle cx="275" cy="305" r="31" fill="none" stroke="#ff8b00" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="260" y="451" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#37566f">Measured transfer error identifies the target feature</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="475" y="120" width="320" height="360" rx="22" fill="url(#panel)" stroke="#7ea6c9" stroke-width="2"/>
    <text x="635" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1d486f">2 · LOCAL OPTICAL WRITE</text>
    <polygon points="585,195 685,195 655,330 615,330" fill="url(#beam)"/>
    <line x1="635" y1="175" x2="635" y2="305" stroke="#ff9d2f" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="635" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#a85800">sub-bandgap processing beam</text>
    <rect x="530" y="330" width="210" height="78" rx="14" fill="#d7e9fb" stroke="#6e9bc4" stroke-width="2"/>
    <circle cx="635" cy="369" r="24" fill="#ffb03a" stroke="#c77200" stroke-width="3"/>
    <path d="M620 369 C629 348, 646 348, 652 369 C645 389, 628 390, 620 369 z" fill="#6d47be" opacity="0.72"/>
    <text x="635" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#37566f">Selected feature changes phase state</text>
    <text x="635" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#37566f">binary or multilevel refractive index</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="820" y="120" width="310" height="360" rx="22" fill="url(#panel)" stroke="#7ea6c9" stroke-width="2"/>
    <text x="975" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1d486f">3 · VERIFY AND RETAIN</text>
    <rect x="870" y="190" width="210" height="90" rx="15" fill="#2e8d79"/>
    <text x="975" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">NONVOLATILE STATE</text>
    <text x="975" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#edfff9">No continuous bias required</text>
    <rect x="870" y="305" width="210" height="95" rx="15" fill="#6d47be"/>
    <text x="975" y="339" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">TRANSFER FUNCTION</text>
    <text x="975" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f4efff">Measured against target</text>
    <text x="975" y="447" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#37566f">Repeat only where residual error remains</text>
  </g>

  <g stroke="#31547a" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="450" y1="300" x2="470" y2="300"/>
    <line x1="795" y1="300" x2="815" y2="300"/>
    <path d="M1020 490 C1010 560, 220 570, 200 490"/>
  </g>
  <text x="600" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#31547a">Closed-loop calibration · measure → compare → rewrite → verify</text>
</svg>